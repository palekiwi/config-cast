# scoped token comes from ATLASSIAN_CLI_TOKEN_SPABREAKS (see flake.nix).
# Scoped tokens only work through the API gateway, so base_url is
# https://api.atlassian.com/ex/jira/<cloudId>; the cloudId comes from
# https://spabreaks.atlassian.net/_edge/tenant_info
default_profile: spabreaks
profiles:
